experiment:
  name: incremental_observation_v1
  seed: 42

video:
  # 模型每次只看到最近 window_seconds 秒，绝不会读取 window_end 之后的帧。
  window_seconds: 6.0
  stride_seconds: 3.0

sampling:
  sample_fps: 1.0
  min_frames: 4
  max_frames: 6
  max_image_side: 512
  jpeg_quality: 80

model:
  provider: local_transformers
  name: Qwen3-VL-8B-Instruct
  api_key: null
  base_url: null
  temperature: 0
  max_tokens: 3000
  timeout_seconds: 120
  network_retries: 2

  # 本地模型参数，仅当 provider == local_transformers 时生效
  local_model_path: /home/Datasets/Hf_model/Qwen3-VL-8B-Instruct
  device: auto          # auto | cuda | cpu
  torch_dtype: bfloat16 # bfloat16 | float16 | float32
  load_in_8bit: false
  load_in_4bit: false
  max_model_len: 32768
  trust_remote_code: true

observation:
  schema_version: "1.0"
  require_evidence_frames: true
  use_candidate_global_ids: true

runtime:
  realtime: false
  carry_previous_state: true
  save_sampled_frames: true
  max_windows: null

storage:
  output_root: outputs
  save_raw_responses: true
  save_sampled_frames: true

video_metadata:
  video_name: VS1断路器操动机构储能回路故障排查标准化作业
  video_category: 断路器操动机构
  task_background: 国家电网新员工标准化作业培训视频；只抽取当前窗口可见事实，不判断完整流程。
