[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-stream-video"
version = "0.1.0"
description = "Streaming-style local video observation with Qwen"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "openai>=1.66.0",
    "opencv-python-headless>=4.10.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
local = [
    "torch>=2.0",
    "torchvision",
    "transformers>=4.57.0",
    "qwen_vl_utils",
    "accelerate",
    "sentencepiece",
    "protobuf",
    "pillow",
]

[project.scripts]
qwen-stream-video = "qwen_stream_video.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
